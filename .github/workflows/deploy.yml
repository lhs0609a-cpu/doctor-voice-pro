name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  automation-checks:
    uses: ./.github/workflows/automation-tests.yml
  deploy-frontend:
    needs: [automation-checks, deploy-backend]
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://doctor-voice-pro-backend.fly.dev

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

  deploy-backend:
    needs: automation-checks
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Dockerfile 이 backend/ 를 빌드 컨텍스트로 가정한다(COPY requirements.txt).
      # 레포 루트에서 --config 로 부르면 컨텍스트가 루트가 되어 빌드가 깨진다.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
