# fly.toml app configuration file generated for doctor-voice-pro-backend on 2025-11-02T12:34:11+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doctor-voice-pro-backend'
primary_region = 'nrt'

[build]
  dockerfile = './Dockerfile'

[env]
  ALLOWED_ORIGINS = '*'
  DATABASE_URL = 'sqlite+aiosqlite:////data/doctorvoice.db'
  DATABASE_URL_SYNC = 'sqlite:////data/doctorvoice.db'
  MEDIA_DIR = '/data/media'

[[mounts]]
  source = 'doctorvoice_data'
  destination = '/data'
  # 1GB 로는 워드 100건 두 배치에 볼륨이 찼다(2026-09-28). 차는 순간 SQLite 가
  # 'disk is full' 을 내며 예약뿐 아니라 API 전체가 멈춘다.
  initial_size = '3gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # AI 생성 중 머신 중지 방지
  auto_start_machines = true
  min_machines_running = 1  # 항상 최소 1개 머신 실행
  processes = ['app']

  # HTTP 타임아웃 설정 (AI 생성 시간 고려 - 5분)
  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

  [http_service.http_options]
    idle_timeout = 300  # 5분 유휴 타임아웃
    response_header_timeout = 300  # 5분 응답 헤더 타임아웃

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2          # 블로그 지수 판정(HTML 파싱)이 CPU 를 먹어 1코어에서는 요청이 굶었다(2026-09 실측)
  # 1GB 로는 발행 묶음이 돌 때 톱니가 천장에 닿아 커널이 죽였다(2026-10-27
  # exit_code=137 oom_killed, 하루에 두 번). 부팅 직후 300MB → 20분 만에 568MB.
  # 숫자는 fly scale memory 로도 바꿀 수 있지만, 여기 적어 두지 않으면 다음 배포에
  # 1024 로 되돌아간다. app/services/memory_guard.py 가 85% 에서 경고한다.
  memory_mb = 2048
